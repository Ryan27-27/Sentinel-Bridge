<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Sentinel platform architecture</title>
  <desc>Pipeline and Range feed findings into a unified ATT&amp;CK coverage report.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="340" fill="#ffffff"/>

  <rect x="60" y="40" width="260" height="80" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="190" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">pipeline/</text>
  <text x="190" y="84" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">SAST, DAST, secrets scan</text>
  <text x="190" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">findings tagged with CWE</text>

  <rect x="360" y="40" width="260" height="80" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="490" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">range/</text>
  <text x="490" y="84" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">exploit chain vs detector</text>
  <text x="490" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">attacks tagged with ATT&amp;CK ID</text>

  <text x="190" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">attack_mapping.py: CWE to ATT&amp;CK</text>

  <line x1="190" y1="120" x2="290" y2="220" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="490" y1="120" x2="390" y2="220" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="140" y="220" width="400" height="80" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="246" text-anchor="middle" font-family="monospace" font-size="13" font-weight="500" fill="#26215C">scripts/unified_report.py</text>
  <text x="340" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">joins both sides by ATT&amp;CK technique ID</text>
  <text x="340" y="284" text-anchor="middle" font-family="monospace" font-size="12" fill="#3C3489">-&gt; unified_dashboard.html</text>
</svg>
